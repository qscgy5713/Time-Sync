services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: timesync
    volumes:
      - timesync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesync -d timesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://timesync:${POSTGRES_PASSWORD}@postgres:5432/timesync?sslmode=disable
      PORT: "8080"
      PUBLIC_URL: https://${DOMAIN}
      ALLOWED_ORIGIN: https://${DOMAIN}

  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose: Caddy serves both under the same domain, so the
        # frontend calls /api/* as a relative, same-origin path.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  timesync_pgdata:
  caddy_data:
  caddy_config:
