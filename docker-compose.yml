services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesync
      POSTGRES_PASSWORD: timesync
      POSTGRES_DB: timesync
    ports:
      - "5432:5432"
    volumes:
      - timesync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesync -d timesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://timesync:timesync@postgres:5432/timesync?sslmode=disable
      PORT: "8080"
      PUBLIC_URL: http://localhost:5173
      ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  timesync_pgdata:
